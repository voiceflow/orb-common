parameters:
  run_on_root:
    description: Check that allow the command to run on root
    type: boolean
    default: false
  executor:
    description: Executor to run the command on
    type: executor
    default: node-executor
  cache_branch:
    description: Branch name to key the node_modules cache on, e.g. the source PR branch on a merge-queue build
    type: string
    default: ""
executor: << parameters.executor >>
steps:
  - checkout_clone
  - attach_workspace:
      at: ~/voiceflow
  - install_node_modules:
      cache_branch: << parameters.cache_branch >>
  - restore_cache:
      name: Restoring eslint Cache
      keys:
        - eslint-cache-{{`{{ .Branch }}`}}
        - eslint-cache-master
  - monorepo_lint_report:
      run_on_root: << parameters.run_on_root >>
      force_execution: true
  - save_cache:
      name: Saving eslint Cache
      key: eslint-cache-{{`{{ .Branch }}`}}-{{`{{ .BuildNum }}`}}
      paths:
        - ~/voiceflow/apps/creator-app/.eslintcache
