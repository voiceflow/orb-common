parameters:
  schema_dir:
    description: Directory to store schemas between jobs
    type: string
    default: "/tmp/schemas"
  docs_repo:
    description: Repository containing Mintlify docs
    type: string
    default: "docs-v2"
  publish_to_docs_repo:
    description: >-
      Commit the schemas to docs_repo's default branch (the legacy docs tooling repository).
      Turn off once the docs' home consumes them directly from the mailbox branch.
    type: boolean
    default: true
  publish_to_website:
    description: >-
      Also push the schemas onto a mailbox branch of the docs' home (website_repo), where the
      website's own workflow converges them to main through a pull request under a member
      identity - this job never touches its main.
    type: boolean
    default: true
  website_repo:
    description: The docs' home, under github.com/voiceflow/
    type: string
    default: "voiceflow-website"
  website_branch:
    description: The mailbox branch on website_repo (an orphan holding only the spec files)
    type: string
    default: "docs-automation/specs"
  website_specs_dir:
    description: Where the spec files live in website_repo
    type: string
    default: "content/docs/specs"
  executor:
    description: Executor to run the command on
    type: executor
    default: node-executor
executor: << parameters.executor >>
steps:
  - checkout_clone
  - attach_workspace:
      at: ~/voiceflow
  - install_node_modules
  - openapi_restore_schemas:
      attach_workspace: true
      from: "<< parameters.schema_dir >>"
      to: ~/voiceflow
  - run:
      name: Extract the public OpenAPI schemas
      command: yarn schema:extract:public
  - when:
      condition: << parameters.publish_to_docs_repo >>
      steps:
        - clone_repo:
            step_name: Clone Mintlify docs repository
            github_username: GITHUB_USERNAME
            github_token: GITHUB_TOKEN
            github_repo_name: "<< parameters.docs_repo >>"
            path_to_clone: ~/docs
        - run:
            name: Commit OpenAPI schemas (public + stable) to Mintlify docs repo
            command: |
              # copy schemas to docs repo: every app's public spec, plus the stable spec
              # where an app produced one (creator-app persists apps/realtime/openapi.stable.json
              # to the workspace; platform persists none, so the copy and the add are guarded)
              cd apps
              cp -v --parents */openapi.public.json ~/docs/specs
              stable=0
              for f in */openapi.stable.json; do
                if [ -f "$f" ]; then cp -v --parents "$f" ~/docs/specs; stable=1; fi
              done
              [ "$stable" = 1 ] || echo "no app produced openapi.stable.json - stable spec not copied"

              # within the docs repo
              cd ~/docs
              git config --global user.email "serviceaccount@voiceflow.com"
              git config --global user.name "Voiceflow"
              git add specs/*/openapi.public.json
              for f in specs/*/openapi.stable.json; do
                if [ -f "$f" ]; then git add "$f"; fi
              done
              git diff-index --quiet HEAD || git commit -m "feat: evolve ${CIRCLE_PROJECT_REPONAME} schemas"
              git pull --rebase
              git push
  - when:
      condition: << parameters.publish_to_website >>
      steps:
        - run:
            name: Push the OpenAPI schemas to the docs' home (<< parameters.website_repo >>)
            environment:
              WEBSITE_REPO: << parameters.website_repo >>
              WEBSITE_BRANCH: << parameters.website_branch >>
              WEBSITE_SPECS_DIR: << parameters.website_specs_dir >>
            command: <<include(scripts/monorepo/publish_specs_to_website.sh)>>
