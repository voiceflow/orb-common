parameters:
  cache_prefix:
    description: Cache prefix
    type: string
    default: "monorepo-schema-validate"
  schema_dir:
    description: Directory to store schemas between jobs
    type: string
    default: "/tmp/schemas"
  skip_tests:
    description: Skip the tests but save the updated schemas
    type: boolean
    default: false
  executor:
    description: Executor to run the command on
    type: executor
    default: node-executor
  cache_branch:
    description: Branch name to key the node_modules cache on, e.g. the source PR branch on a merge-queue build
    type: string
    default: ""
  request_remote_docker:
    description: >-
      Set up remote Docker. Only the oasdiff comparison in `yarn schema:validate` needs it, and only when the repo is on
      `@voiceflow/package-scripts` older than 1.9.0, which runs `tufin/oasdiff` in a container. When `skip_tests` is
      false, this job installs a pinned oasdiff binary, and package-scripts 1.9.0 or later runs that binary instead.
      Set to false when the repo is on package-scripts 1.9.0 or later, or when `skip_tests` is true (the script exits
      before oasdiff). A job that sets up remote Docker is billed at the Linux VM rate for its whole run.
    type: boolean
    default: true
executor: << parameters.executor >>
steps:
  - when:
      condition: << parameters.request_remote_docker >>
      steps:
        - setup_remote_docker:
            version: default
  - checkout_clone
  - install_node_modules:
      avoid_post_install_scripts: false
      cache_branch: << parameters.cache_branch >>
  - attach_workspace:
      at: ~/voiceflow
  - clone_repo:
      step_name: Clone openapi-schemas repository
      github_username: GITHUB_USERNAME
      github_token: GITHUB_TOKEN
      github_repo_name: openapi-schemas
      path_to_clone: ~/schemas
  - openapi_restore_schemas:
      from: ~/schemas
      to: ~/voiceflow
  - unless:
      condition: << parameters.skip_tests >>
      steps:
        - openapi_install_oasdiff
  - run:
      name: Validate Schemas
      environment:
        SKIP_ACCEPTANCE_TESTS: "<< parameters.skip_tests >>"
      command: yarn schema:validate
  - openapi_persist_schemas:
      workspace_dir: "<< parameters.schema_dir >>"
