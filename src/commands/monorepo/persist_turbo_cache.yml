description: >-
  Persist the Turborepo local cache (.turbo/cache) to the workspace, so later jobs that attach the workspace
  reuse the build's task outputs. Callers never name the path. Call it from one job per workflow: when two
  jobs that run at the same time persist the same cache file, attach_workspace fails in any job that
  requires both.
steps:
  - run:
      name: Ensure turbo cache directory exists
      command: mkdir -p .turbo/cache
  - persist_to_workspace:
      root: "."
      paths:
        - .turbo/cache
