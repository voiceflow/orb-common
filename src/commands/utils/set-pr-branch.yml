parameters:
  working_directory:
    description: Directory of git repo
    type: string
    default: "."
  pr_number_env_var:
    description: Environment variable to get the PR number from
    type: env_var_name
    default: PR_NUMBER
  target_env_var:
    description: Environment variable to set with the branch name for the PR
    type: env_var_name
    default: PR_BRANCH
steps:
  - run:
      name: Set << parameters.target_env_var >> variable with the PR branch
      working_directory: << parameters.working_directory >>
      command: |
        if [ -z "${<< parameters.pr_number_env_var >>}" ]; then
          echo "No PR number found, skipping"
          exit 0
        fi

        API_URL="https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/pulls/${<< parameters.pr_number_env_var >>:?}"
        # Warn rather than fail — an unresolved branch only costs the cache_branch optimization.
        # curl exits 0 on a 5xx body, so without --retry a blip silently disables cache reuse.
        RESPONSE=$(curl -sS --max-time 15 --retry 3 --retry-delay 2 \
          -H "Authorization: token ${GITHUB_TOKEN:?}" "${API_URL}") || RESPONSE=""
        PR_BRANCH=$(printf '%s' "${RESPONSE}" | jq -r '.head.ref // empty') || PR_BRANCH=""

        if [ -z "${PR_BRANCH}" ]; then
          echo "WARNING: could not resolve the head branch for PR ${<< parameters.pr_number_env_var >>}; cache reuse will fall back to master"
        fi

        echo "export << parameters.target_env_var >>=\"${PR_BRANCH}\"" >> "$BASH_ENV"
